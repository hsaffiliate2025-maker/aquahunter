name: AquaHunterMac
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: C8Y5J74PQW
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
targets:
  AquaHunterMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: ../apple/Shared
      - path: Resources
        buildPhase: resources
      - path: ../map-assets
        buildPhase: resources
    preBuildScripts:
      - name: Validate production data licenses
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            python3 "$SRCROOT/../tools/validate_data_sources.py" --release
            python3 "$SRCROOT/../tools/validate_release_content.py"
          fi
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: AquaHunter
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.business
        NSHumanReadableCopyright: Copyright © 2026 Hot Season Enterprise, Inc.
    entitlements:
      path: AquaHunterMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hotseason.aquahunter
        PRODUCT_NAME: AquaHunterMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - AquaHunterMacTests
  AquaHunterMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ../apple/Tests
    dependencies:
      - target: AquaHunterMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hotseason.aquahunter.macos.tests
        GENERATE_INFOPLIST_FILE: YES
