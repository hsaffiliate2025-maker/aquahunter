name: AquaHunterIOS
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: C8Y5J74PQW
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.26.0
targets:
  AquaHunterIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../apple/Shared
      - path: Resources
        buildPhase: resources
      - path: ../map-assets
        buildPhase: resources
    dependencies:
      - package: MapLibre
    preBuildScripts:
      - name: Validate production data licenses
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            python3 "$SRCROOT/../tools/validate_data_sources.py" --release
            python3 "$SRCROOT/../tools/validate_release_content.py"
          fi
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: AquaHunter
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hotseason.aquahunter
        PRODUCT_NAME: AquaHunterIOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - AquaHunterIOSTests
  AquaHunterIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../apple/Tests
    dependencies:
      - target: AquaHunterIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hotseason.aquahunter.tests
        GENERATE_INFOPLIST_FILE: YES
